# ==========================================
# SEGURIDAD DE APACHE - SISTEMA TICKETS
# ==========================================

# Proteger archivos sensibles
<FilesMatch "^(\.env(\..*)?|config\.php)$">
    Require all denied
</FilesMatch>

# ==========================================
# PROTEGER REGISTROS
# ==========================================
<Directory "/var/www/html/sistema-tickets/storage/logs">
    AllowOverride None
    AllowOverrideList None
    Options -Indexes
    Require all denied
</Directory>

# ==========================================
# PROTEGER ADJUNTOS
# ==========================================
<Directory "/var/www/html/sistema-tickets/upload/uploads/attachments">
    AllowOverride None
    AllowOverrideList None
    Options -Indexes -ExecCGI

    php_admin_flag engine Off

    <FilesMatch "(?i)\.(php[0-9]*|phps|pht|phtml|phar|inc|cgi|pl|py|sh|bash)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

# ==========================================
# PROTEGER LOGOS Y ARCHIVOS PUBLICOS
# ==========================================
<Directory "/var/www/html/sistema-tickets/publico/uploads">
    AllowOverride None
    AllowOverrideList None
