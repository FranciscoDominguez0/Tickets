services:

  web:
    build: .
    container_name: php_app
    restart: always
    env_file:
      - .env

    ports:
      - "9080:80"

    depends_on:
      - db

    volumes:
      # Adjuntos y PDFs de tickets
      - ./upload/uploads/attachments:/var/www/html/sistema-tickets/upload/uploads/attachments
      # Firmas digitales
      - ./firmas:/var/www/html/sistema-tickets/firmas

  db:
    image: mysql:8.0
    container_name: mysql_app
    restart: always

    env_file:
      - .env

    ports:
      - "127.0.0.1:13306:3306"

    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_app
    restart: always

    ports:
      - "127.0.0.1:9081:80"

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    depends_on:
      - db

volumes:
  db_data:
